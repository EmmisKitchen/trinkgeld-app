<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#202124"><link rel="manifest" href="manifest.webmanifest">
<title>Trinkgeldabrechnung</title>
<style>
:root{--bg:#f5f5f3;--panel:#fff;--ink:#202124;--muted:#6b6b6b;--line:#d7d7d2;--head:#ecece7;--active:#1f6feb;--service:#f4f7fb;--kitchen:#fbf7ef}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:20px;margin:0 12px 0 0}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}select,button,input{font:inherit} select,button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px}button{cursor:pointer}.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.status{margin-left:auto;font-size:13px;color:var(--muted)}
.wrap{padding:12px}.tablebox{overflow:auto;max-height:calc(100vh - 82px);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 3px #00000010;padding-bottom:14px}
table{border-collapse:separate;border-spacing:0;min-width:2800px;font-size:14px}th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;text-align:center;height:34px;white-space:nowrap}
th{background:var(--head);font-weight:600}.sticky1{position:sticky;left:0;z-index:8}.sticky2{position:sticky;left:150px;z-index:8}.sticky3{position:sticky;left:255px;z-index:8}.top{position:sticky;top:0;z-index:7}.top.sticky1,.top.sticky2,.top.sticky3{z-index:12}
.name{width:150px;min-width:150px;text-align:left;padding:0 10px;background:#fff}.kind{width:48px;min-width:48px;background:#fff}.day{width:62px;min-width:62px}.total{width:105px;min-width:105px;background:#f8f8f6;font-weight:700}
.section td,.section th{height:28px;font-weight:700;text-align:left;padding-left:10px}.section.service td{background:var(--service)}.section.kitchen td{background:var(--kitchen)}
.cellinput{width:100%;height:33px;border:0;background:transparent;text-align:center;padding:4px;font-size:16px;outline:none}.cellinput:focus{box-shadow:inset 0 0 0 3px var(--active);background:#fff}.money{font-variant-numeric:tabular-nums}.summary{background:#fafafa;font-weight:600}.warn{background:#fff1f0!important;color:#a8071a}
.modal{display:none;position:fixed;inset:0;background:#0007;z-index:50;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.card{background:#fff;border-radius:14px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:18px}.card h2{margin-top:0}.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}.staffrow{display:flex;gap:6px;margin:6px 0}.staffrow input{flex:1;padding:8px;border:1px solid var(--line);border-radius:7px}.staffrow button{padding:6px 9px}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
@media(max-width:700px){.cols{grid-template-columns:1fr}.status{width:100%;margin-left:0}.wrap{padding:6px}.tablebox{max-height:calc(100vh - 112px);padding-bottom:16px}}
</style></head>
<body>
<header><h1>Trinkgeldabrechnung <span id="branchBadge" style="font-size:14px;font-weight:500;color:var(--muted)"></span></h1><div class="controls"><select id="month"></select><label style="display:flex;align-items:center;gap:5px">Küche <input id="kitchenPct" type="text" inputmode="decimal" style="width:58px;padding:8px;border:1px solid var(--line);border-radius:8px;text-align:right"> %</label><button id="newMonth">Neuer Monat</button><button id="staff">Mitarbeiter</button><button id="excelExport">Excel exportieren</button><button id="export">Sicherung</button><label><input id="importFile" type="file" accept="application/json" hidden><button id="importBtn" type="button">Laden</button></label></div><div class="status" id="status">lokal gespeichert</div></header>
<div class="wrap"><div class="tablebox"><table id="grid"></table></div></div>
<div class="modal" id="staffModal"><div class="card"><h2>Mitarbeiter für <span id="staffMonth"></span></h2><p class="hint">Änderungen gelten nur für diesen Monat. Maximal 15 Service- und 10 Küchenmitarbeiter.</p><div class="cols"><div><h3>Service</h3><div id="serviceList"></div><button data-add="service">+ Mitarbeiter</button></div><div><h3>Küche</h3><div id="kitchenList"></div><button data-add="kitchen">+ Mitarbeiter</button></div></div><div class="foot"><button id="cancelStaff">Abbrechen</button><button class="primary" id="saveStaff">Übernehmen</button></div></div></div>
<div class="modal" id="branchModal"><div class="card" style="max-width:440px"><h2>Filiale einrichten</h2><p class="hint">Einmalig den Filialnamen für dieses iPad festlegen. Er erscheint oben und im Excel-Dateinamen.</p><div class="staffrow"><input id="branchName" placeholder="z. B. Augsburg"></div><div class="foot"><button class="primary" id="saveBranch">Speichern</button></div></div></div>
<script>
const KEY='emmis-tip-v1'; const BRANCH_KEY='emmis-tip-branch'; const pct=.015;
const defaultStaff={service:Array.from({length:15},(_,i)=>i<2?['Service 1','Service 2'][i]:''),kitchen:Array.from({length:10},(_,i)=>i<2?['Küche 1','Küche 2'][i]:'')};
let db=load(); let current=Object.keys(db.months).sort().at(-1)||ym(new Date()); if(!db.months[current]) db.months[current]=freshMonth(current,null);
Object.values(db.months).forEach(m=>{if(m.kitchenPct==null)m.kitchenPct=defaultPct}); save();
function ym(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')} function daysIn(k){let [y,m]=k.split('-').map(Number);return new Date(y,m,0).getDate()}
function label(k){let [y,m]=k.split('-').map(Number);return new Intl.DateTimeFormat('de-DE',{month:'long',year:'numeric'}).format(new Date(y,m-1,1))}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{months:{}}}catch(e){return{months:{}}}}
function branch(){return localStorage.getItem(BRANCH_KEY)||''}
function showBranch(){document.getElementById('branchBadge').textContent=branch()?('– '+branch()):''}
function save(){localStorage.setItem(KEY,JSON.stringify(db));document.getElementById('status').textContent='gespeichert '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}
function freshMonth(k,prev){let n=daysIn(k), staff=prev?structuredClone(prev.staff):structuredClone(defaultStaff), kitchenPct=prev?(prev.kitchenPct??defaultPct):defaultPct;return{staff,kitchenPct,days:Array.from({length:n},()=>({revenue:'',tip:'',service:{},kitchen:{}}))}}
function activeStaff(type){return db.months[current].staff[type].map((n,i)=>({n:n.trim(),i})).filter(x=>x.n)}
function num(v){let x=parseFloat(String(v).replace(',','.'));return Number.isFinite(x)?x:0} function euro(v){return v.toLocaleString('de-DE',{style:'currency',currency:'EUR'})}
function calcDay(d){let rev=num(d.revenue),tip=num(d.tip),kt=rev*(db.months[current].kitchenPct??defaultPct),st=tip-kt;let ks=Object.values(d.kitchen).reduce((a,v)=>a+num(v),0),ss=Object.values(d.service).reduce((a,v)=>a+num(v),0);return{kt,st,ks,ss}}
function personTip(type,idx,di){let d=db.months[current].days[di],c=calcDay(d),h=num(d[type][idx]);if(!h)return 0;if(type==='kitchen')return c.ks?c.kt/c.ks*h:0;return c.ss?c.st/c.ss*h:0}
function renderMonthSelect(){let s=document.getElementById('month');s.innerHTML='';Object.keys(db.months).sort().reverse().forEach(k=>{let o=document.createElement('option');o.value=k;o.textContent=label(k);o.selected=k===current;s.append(o)})}
function fmtPct(){return ((db.months[current].kitchenPct??defaultPct)*100).toLocaleString('de-DE',{maximumFractionDigits:3})}
function render(){renderMonthSelect();let pe=document.getElementById('kitchenPct');if(pe)pe.value=fmtPct();let m=db.months[current],n=m.days.length,g=document.getElementById('grid');let h='<thead><tr><th class="top sticky1 name">Mitarbeiter</th><th class="top sticky2 total">Gesamt</th><th class="top sticky3 kind"></th>';for(let d=1;d<=n;d++)h+=`<th class="top day">${d}</th>`;h+='</tr></thead><tbody>';
 h+=rowTop('Umsatz','revenue',n)+rowTop('Kartentip','tip',n)+rowCalc('Küche '+fmtPct()+' %','kt',n)+rowCalc('Service Rest','st',n);
 h+=`<tr class="section service"><td class="sticky1 name">SERVICE</td><td class="sticky2 total"></td><td class="sticky3 kind"></td><td colspan="${n}"></td></tr>`;h+=staffRows('service',n);
 h+=`<tr class="section kitchen"><td class="sticky1 name">KÜCHE</td><td class="sticky2 total"></td><td class="sticky3 kind"></td><td colspan="${n}"></td></tr>`;h+=staffRows('kitchen',n);g.innerHTML=h;bindInputs();}
function rowTop(name,key,n){let total=db.months[current].days.reduce((a,d)=>a+num(d[key]),0);let s=`<tr><td class="sticky1 name summary">${name}</td><td class="sticky2 total money">${euro(total)}</td><td class="sticky3 kind summary">€</td>`;db.months[current].days.forEach((d,i)=>{s+=`<td><input class="cellinput money" inputmode="decimal" data-top="${key}" data-day="${i}" value="${d[key]}"></td>`});return s+'</tr>'}
function rowCalc(name,key,n){let vals=db.months[current].days.map(d=>calcDay(d)[key]),tot=vals.reduce((a,v)=>a+v,0);let s=`<tr><td class="sticky1 name summary">${name}</td><td class="sticky2 total money">${euro(tot)}</td><td class="sticky3 kind summary">€</td>`;vals.forEach(v=>{let bad=key==='st'&&v<0?' warn':'';s+=`<td class="money${bad}">${euro(v)}</td>`});return s+'</tr>'}
function staffRows(type,n){let s='';activeStaff(type).forEach(({n:name,i:idx})=>{let total=db.months[current].days.reduce((a,d,di)=>a+personTip(type,idx,di),0);s+=`<tr><td class="sticky1 name">${esc(name)}</td><td class="sticky2 total money">${euro(total)}</td><td class="sticky3 kind">h</td>`;db.months[current].days.forEach((d,di)=>{let v=d[type][idx]??'',pt=personTip(type,idx,di);s+=`<td title="Trinkgeld: ${euro(pt)}"><input class="cellinput" inputmode="decimal" data-type="${type}" data-idx="${idx}" data-day="${di}" value="${v}"></td>`});s+='</tr>'});return s}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function commit(el){let di=+el.dataset.day,d=db.months[current].days[di];if(el.dataset.top)d[el.dataset.top]=el.value;else d[el.dataset.type][el.dataset.idx]=el.value}
function nextSelector(el){let day=+el.dataset.day;if(el.dataset.top){let order=['revenue','tip'];let i=order.indexOf(el.dataset.top);if(i<order.length-1)return `[data-top="${order[i+1]}"][data-day="${day}"]`;let f=activeStaff('service')[0]||activeStaff('kitchen')[0];if(!f)return null;let t=activeStaff('service').length?'service':'kitchen';return `[data-type="${t}"][data-idx="${f.i}"][data-day="${day}"]`}
 let type=el.dataset.type,idx=+el.dataset.idx,list=activeStaff(type),p=list.findIndex(x=>x.i===idx);if(p<list.length-1)return `[data-type="${type}"][data-idx="${list[p+1].i}"][data-day="${day}"]`;if(type==='service'){let k=activeStaff('kitchen')[0];if(k)return `[data-type="kitchen"][data-idx="${k.i}"][data-day="${day}"]`}let nd=day+1;if(nd<db.months[current].days.length)return `[data-top="revenue"][data-day="${nd}"]`;return null}
function verticalInputs(day){let a=[`[data-top="revenue"][data-day="${day}"]`,`[data-top="tip"][data-day="${day}"]`];activeStaff('service').forEach(x=>a.push(`[data-type="service"][data-idx="${x.i}"][data-day="${day}"]`));activeStaff('kitchen').forEach(x=>a.push(`[data-type="kitchen"][data-idx="${x.i}"][data-day="${day}"]`));return a}
function ownSelector(el,day=+el.dataset.day){if(el.dataset.top)return `[data-top="${el.dataset.top}"][data-day="${day}"]`;return `[data-type="${el.dataset.type}"][data-idx="${el.dataset.idx}"][data-day="${day}"]`}
function arrowSelector(el,key){let day=+el.dataset.day,n=db.months[current].days.length;if(key==='ArrowLeft')return day>0?ownSelector(el,day-1):null;if(key==='ArrowRight')return day<n-1?ownSelector(el,day+1):null;let list=verticalInputs(day),cur=ownSelector(el),i=list.indexOf(cur);if(key==='ArrowUp')return i>0?list[i-1]:null;if(key==='ArrowDown')return i>=0&&i<list.length-1?list[i+1]:null;return null}
function moveAfterEdit(el,q){commit(el);save();render();requestAnimationFrame(()=>{let n=q&&document.querySelector(q);if(n){n.focus();n.select();n.scrollIntoView({block:'nearest',inline:'nearest'})}})}
function bindInputs(){document.querySelectorAll('.cellinput').forEach(el=>{el.addEventListener('change',()=>{commit(el);save();let q=ownSelector(el);render();requestAnimationFrame(()=>document.querySelector(q)?.focus())});el.addEventListener('keydown',e=>{let q=null;if(e.key==='Enter')q=nextSelector(el);else if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))q=arrowSelector(el,e.key);else return;if(!q)return;e.preventDefault();moveAfterEdit(el,q)})})}
function openStaff(){document.getElementById('staffMonth').textContent=label(current);['service','kitchen'].forEach(type=>{let box=document.getElementById(type+'List');box.innerHTML='';db.months[current].staff[type].forEach((name,i)=>{if(name||i<2)addStaffRow(box,type,name,i)})});document.getElementById('staffModal').classList.add('show')}
function addStaffRow(box,type,name='',idx=null){let d=document.createElement('div');d.className='staffrow';d.dataset.type=type;if(idx!==null)d.dataset.idx=idx;d.innerHTML=`<input value="${esc(name)}" placeholder="Name"><button type="button">×</button>`;d.querySelector('button').onclick=()=>d.remove();box.append(d)}
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{let t=b.dataset.add,box=document.getElementById(t+'List'),max=t==='service'?15:10;if(box.children.length<max)addStaffRow(box,t)});
document.getElementById('staff').onclick=openStaff;document.getElementById('cancelStaff').onclick=()=>document.getElementById('staffModal').classList.remove('show');document.getElementById('saveStaff').onclick=()=>{['service','kitchen'].forEach(type=>{let max=type==='service'?15:10,arr=[];document.querySelectorAll(`#${type}List .staffrow input`).forEach(i=>{if(i.value.trim())arr.push(i.value.trim())});while(arr.length<max)arr.push('');db.months[current].staff[type]=arr.slice(0,max)});save();document.getElementById('staffModal').classList.remove('show');render()};
document.getElementById('kitchenPct').addEventListener('change',e=>{let v=num(e.target.value);if(v<0)v=0;db.months[current].kitchenPct=v/100;save();render()});
document.getElementById('kitchenPct').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.target.blur()}});
document.getElementById('month').onchange=e=>{current=e.target.value;render()};document.getElementById('newMonth').onclick=()=>{let [y,m]=current.split('-').map(Number),d=new Date(y,m,1),k=ym(d);if(db.months[k]){current=k;return render()}db.months[k]=freshMonth(k,db.months[current]);current=k;save();render();openStaff()};


function monthSummary(){
 let m=db.months[current],rows=[];
 ['service','kitchen'].forEach(type=>{
   activeStaff(type).forEach(({n:name,i:idx})=>{
     let hours=m.days.reduce((a,d)=>a+num(d[type][idx]),0);
     let tip=m.days.reduce((a,d,di)=>a+personTip(type,idx,di),0);
     rows.push({name,type:type==='service'?'Service':'Küche',hours,tip});
   });
 });
 let revenue=m.days.reduce((a,d)=>a+num(d.revenue),0);
 let cardTip=m.days.reduce((a,d)=>a+num(d.tip),0);
 let kitchen=m.days.reduce((a,d)=>a+calcDay(d).kt,0);
 let service=m.days.reduce((a,d)=>a+calcDay(d).st,0);
 return {rows,revenue,cardTip,kitchen,service,total:kitchen+service};
}
function xesc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function crc32(bytes){let c=0xffffffff;for(let b of bytes){c^=b;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0)}return (c^0xffffffff)>>>0}
function u16(n){return [n&255,(n>>>8)&255]} function u32(n){return [n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255]}
function zipStore(files){
 let enc=new TextEncoder(),locals=[],centrals=[],offset=0;
 const dosTime=[0,0], dosDate=[33,0];
 for(let [name,data] of files){
  let nb=enc.encode(name),body=enc.encode(data),crc=crc32(body);
  let local=new Uint8Array([
   ...u32(0x04034b50),20,0, 0,0, 0,0, ...dosTime,...dosDate,
   ...u32(crc),...u32(body.length),...u32(body.length),
   ...u16(nb.length),0,0, ...nb,...body
  ]);
  locals.push(local);
  let central=new Uint8Array([
   ...u32(0x02014b50),20,0, 20,0, 0,0, 0,0, ...dosTime,...dosDate,
   ...u32(crc),...u32(body.length),...u32(body.length),
   ...u16(nb.length),0,0, 0,0, 0,0, 0,0, ...u32(0), ...u32(offset), ...nb
  ]);
  centrals.push(central); offset+=local.length;
 }
 let csize=centrals.reduce((a,b)=>a+b.length,0),count=files.length;
 let end=new Uint8Array([
  ...u32(0x06054b50),0,0,0,0,...u16(count),...u16(count),
  ...u32(csize),...u32(offset),0,0
 ]);
 return new Blob([...locals,...centrals,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function cell(ref,val,style=0){
 if(typeof val==='number')return `<c r="${ref}" s="${style}"><v>${Number.isFinite(val)?val:0}</v></c>`;
 return `<c r="${ref}" t="inlineStr" s="${style}"><is><t>${xesc(val)}</t></is></c>`;
}
function exportExcel(){
 let s=monthSummary(), rr=[],r=1;
 rr.push(`<row r="${r}" ht="24">${cell('A'+r,'Trinkgeldabrechnung '+label(current),1)}</row>`);r++;
 rr.push(`<row r="${r}">${cell('A'+r,'Mitarbeiter',2)}${cell('B'+r,'Trinkgeld',2)}</row>`);r++;
 s.rows.forEach(x=>{rr.push(`<row r="${r}">${cell('A'+r,x.name)}${cell('B'+r,x.tip,4)}</row>`);r++});
 r++;
 rr.push(`<row r="${r}">${cell('A'+r,'Kartentrinkgeld gesamt',5)}${cell('B'+r,s.cardTip,5)}</row>`);r++;
 rr.push(`<row r="${r}">${cell('A'+r,'Summe Mitarbeiter',6)}${cell('B'+r,s.total,7)}</row>`);r++;
 rr.push(`<row r="${r}">${cell('A'+r,'Differenz',5)}${cell('B'+r,s.cardTip-s.total,5)}</row>`);r++;
 let sheet=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols><col min="1" max="1" width="30" customWidth="1"/><col min="2" max="2" width="18" customWidth="1"/></cols><sheetData>${rr.join('')}</sheetData><pageMargins left="0.4" right="0.4" top="0.5" bottom="0.5" header="0.2" footer="0.2"/><pageSetup orientation="portrait" fitToWidth="1" fitToHeight="1"/></worksheet>`;
 let styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="2"><numFmt numFmtId="164" formatCode="0.00"/><numFmt numFmtId="165" formatCode="#,##0.00 [$€-407]"/></numFmts><fonts count="3"><font><sz val="11"/><name val="Aptos"/></font><font><b/><sz val="16"/><name val="Aptos"/></font><font><b/><sz val="11"/><name val="Aptos"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="2"><border/><border><top style="double"/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="8"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="165" fontId="2" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="0" fontId="2" fillId="0" borderId="1" xfId="0"/><xf numFmtId="165" fontId="2" fillId="0" borderId="1" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
 let files=[
 ['[Content_Types].xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`],
 ['_rels/.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
